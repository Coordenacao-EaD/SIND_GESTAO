<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Gestão demonstrativa de usuários e permissões do SIND_GESTÃO."
  >

  <title>Usuários e Permissões | SINPROTEC/MT</title>

  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/admin-usuarios.css">

  <script src="../assets/js/area-admin.js" defer></script>
  <script src="../assets/js/admin-usuarios.js" defer></script>
</head>

<body class="admin-page">

  <a class="skip-link" href="#conteudo">
    Ir para o conteúdo principal
  </a>

  <div
    class="admin-sidebar-backdrop"
    data-admin-sidebar-backdrop
    hidden
  ></div>

  <div class="admin-shell">

    <aside
      class="admin-sidebar"
      data-admin-sidebar
      aria-label="Navegação administrativa"
    ></aside>

    <div class="admin-workspace">

      <header
        class="admin-topbar"
        data-admin-topbar
      ></header>

      <main
        id="conteudo"
        class="admin-main"
        tabindex="-1"
      >

        <section
          class="admin-users"
          data-admin-users
          aria-labelledby="admin-users-title"
        >
          <div class="admin-dashboard__loading" role="status">
            Carregando módulo de usuários e permissões...
          </div>
        </section>

      </main>

    </div>
  </div>

</body>
</html>
