<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Gestão demonstrativa de notícias e comunicados do SINPROTEC/MT."
  >

  <title>Notícias e Comunicados | SINPROTEC/MT</title>

  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/admin-comunicacao.css">

  <script src="../assets/js/area-admin.js" defer></script>

  <!-- Bases públicas já existentes -->
  <script src="../assets/js/noticias.js" defer></script>
  <script src="../assets/js/comunicados.js" defer></script>

  <script src="../assets/js/admin-comunicacao.js" defer></script>
</head>

<body class="admin-page">

  <a class="skip-link" href="#conteudo">
    Ir para o conteúdo principal
  </a>

  <div
    class="admin-sidebar-backdrop"
    data-admin-sidebar-backdrop
    hidden
  ></div>

  <div class="admin-shell">

    <aside
      class="admin-sidebar"
      data-admin-sidebar
      aria-label="Navegação administrativa"
    ></aside>

    <div class="admin-workspace">

      <header
        class="admin-topbar"
        data-admin-topbar
      ></header>

      <main
        id="conteudo"
        class="admin-main"
        tabindex="-1"
      >

        <section
          class="admin-content"
          data-admin-content
          aria-labelledby="admin-content-title"
        >

          <div
            class="admin-dashboard__loading"
            role="status"
          >
            Carregando notícias e comunicados...
          </div>

        </section>

      </main>

    </div>
  </div>

</body>
</html>
