<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Ilustração de acesso seguro</title>
  <desc id="desc">Escudo institucional com cadeado, representando a orientação de segurança no acesso.</desc>
  <defs>
    <linearGradient id="auth-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5fa"/>
      <stop offset="1" stop-color="#dfeaf2"/>
    </linearGradient>
    <linearGradient id="auth-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4a74"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <linearGradient id="auth-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ad34"/>
      <stop offset="1" stop-color="#c88b18"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="url(#auth-bg)"/>
