name: Testes do prototipo

on:
  push:
    branches:
      - main
    paths:
      - "protótipo/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "protótipo/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Executar testes do prototipo
        working-directory: "./protótipo"
        run: node --test tests/*.test.mjs
